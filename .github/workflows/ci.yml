name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check script syntax
        run: |
          python3 -m py_compile 00-AI/scripts/kb.py examples/claude-code-hooks/stop-session-check.py
          bash -n install.sh 00-AI/scripts/test_install.sh 00-AI/scripts/test_tools.sh

      - name: Run kit health check
        run: python3 00-AI/scripts/kb.py health-check

      - name: Run Python unit tests
        run: python3 -m unittest discover -s tests

      - name: Run installer tests
        run: bash 00-AI/scripts/test_install.sh

      - name: Run tool tests
        run: bash 00-AI/scripts/test_tools.sh
