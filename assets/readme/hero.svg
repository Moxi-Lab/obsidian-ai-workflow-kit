<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Obsidian AI Workflow Kit</title>
  <desc id="desc">A local-first, human-editable Obsidian workflow that routes an AI session from a startup entry through project context and structured write-back.</desc>
  <rect width="1200" height="390" rx="28" fill="#0d171b"/>
  <path d="M60 66H1140M60 330H1140" stroke="#34484d" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" fill="#f5f3eb">
    <text x="62" y="105" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="2.4" fill="#96d9c0">LOCAL-FIRST AGENT MEMORY</text>
    <text x="60" y="166" font-size="56" font-weight="760">Obsidian AI</text>
    <text x="60" y="224" font-size="56" font-weight="760">Workflow Kit</text>
    <text x="62" y="268" font-size="23" fill="#c7d1cf">A human-editable vault structure that lets AI agents</text>
    <text x="62" y="298" font-size="23" fill="#c7d1cf">start with the right context — and leave it better.</text>
  </g>
  <g transform="translate(642 76)">
    <path d="M108 58H126M234 58H252M360 58H378" fill="none" stroke="#90d7bc" stroke-width="3" stroke-linecap="round"/>
    <path d="M116 48L126 58 116 68M242 48L252 58 242 68M368 48L378 58 368 68" fill="none" stroke="#90d7bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" text-anchor="middle">
      <rect x="0" y="26" width="108" height="64" rx="12" fill="#17262b" stroke="#90d7bc" stroke-width="2"/>
      <text x="54" y="52" fill="#f5f3eb">START</text><text x="54" y="74" fill="#f5f3eb">HERE</text>
      <rect x="126" y="26" width="108" height="64" rx="12" fill="#17262b" stroke="#c8b2ee" stroke-width="2"/>
      <text x="180" y="52" fill="#f5f3eb">PROJECT</text><text x="180" y="74" fill="#f5f3eb">BRIDGE</text>
      <rect x="252" y="26" width="108" height="64" rx="12" fill="#17262b" stroke="#7ca5b2" stroke-width="2"/>
      <text x="306" y="52" fill="#f5f3eb">REQUIRED</text><text x="306" y="74" fill="#f5f3eb">CONTEXT</text>
      <rect x="378" y="26" width="120" height="64" rx="12" fill="#20343a" stroke="#90d7bc" stroke-width="2"/>
      <text x="438" y="52" fill="#f5f3eb">WRITE</text><text x="438" y="74" fill="#f5f3eb">BACK</text>
    </g>
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18" fill="#9eafb1">
      <text x="54" y="124" text-anchor="middle">clear entry</text>
      <text x="180" y="124" text-anchor="middle">current state</text>
      <text x="306" y="124" text-anchor="middle">task-specific files</text>
      <text x="438" y="124" text-anchor="middle">next session</text>
    </g>
    <rect x="0" y="174" width="498" height="91" rx="16" fill="#132126" stroke="#34484d" stroke-width="2"/>
    <text x="26" y="210" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#90d7bc">ROUTE, DON’T SEARCH</text>
    <text x="26" y="241" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="19" fill="#e1e7e3">Read the mapped files first; preserve the handoff.</text>
  </g>
</svg>
